listener 1883
protocol mqtt

# MQTT over TLS for the modem (same certificate as the wss listener below).
# Plain 1883 stays up for devices that have not been switched over yet.
listener 8883
protocol mqtt
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem

listener 8083
protocol websockets
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem

auth_plugin /etc/mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host localhost
auth_opt_http_port 3000
auth_opt_http_getuser_uri  /auth/user
auth_opt_http_aclcheck_uri /auth/acl
auth_opt_http_response_mode status
