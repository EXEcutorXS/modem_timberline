# Rate limits for the account endpoints (http context; included from
# /etc/nginx/conf.d/). Anonymous registration + login each cost a bcrypt hash
# in the Node app, and /auth/user (every MQTT connect) shares that same single
# CPU core - so a flood here has to be cut off in nginx, before it reaches Node.
#   tl_register      per client IP: 6/min sustained (+ burst, see the locations)
#   tl_register_all  across ALL clients together: 60/min - the ceiling on how many
#                    bcrypt hashes registration can ever cost per minute, even from a botnet
#   tl_login         per client IP: 30/min (typos, shared NAT)
limit_req_zone $binary_remote_addr zone=tl_register:10m     rate=6r/m;
limit_req_zone $server_name        zone=tl_register_all:1m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=tl_login:10m        rate=30r/m;
limit_req_status 429;

# Access-log format for the account endpoints: same fields as the default
# "combined" format, but with $uri (path only) instead of $request, so the
# query string - login=...&password=... on /api/register-device - is never
# written to disk.
log_format tl_noargs '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';