server {
    listen 80;
    server_name multihot.duckdns.org;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    /* AT-bridge relay (see server.js) — needs the WebSocket upgrade headers;
       the rest of the site doesn't (MQTT's own wss on 8083 bypasses nginx
       entirely, going straight to mosquitto — this is the only path here
       that's actually a WebSocket through this proxy). */
    location /at-bridge {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
