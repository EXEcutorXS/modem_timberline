server {
    listen 80;
    /* Both domains share the one Let's Encrypt cert (see host/README.md's
       TLS section) — certbot --expand adds a new domain's SAN to the
       existing "multihot.duckdns.org" cert lineage rather than issuing a
       separate one, which is what lets mosquitto's single wss listener
       (one cert file, see timberline-mosquitto.sh) work for either
       hostname a browser used to reach the site. */
    server_name multihot.duckdns.org multihot.online;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    /* AT-bridge relay (see server.js) — needs the WebSocket upgrade headers;
       the rest of the site doesn't (MQTT's own wss on 8083 bypasses nginx
       entirely, going straight to mosquitto — this is the only path here
       that's actually a WebSocket through this proxy). */
    location /at-bridge {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
/* This second, plain-port-80 server block only exists because certbot's own
   --nginx installer moved the block above onto 443 and generated this one
   (marked "managed by Certbot") purely as an HTTP->HTTPS redirect for
   everything. That everything used to include /firmware/ too — but the
   modem's own AT+HTTP client (Modem.cpp's buildOtaUrl()) only ever proven
   against plain http://, so a hard 301 to https:// broke firmware fetches
   for it. Rather than route the modem through :3000 directly (open to the
   whole internet, same port the login/register endpoints sit behind with
   no TLS — real exposed attack surface for no reason, 2026-09-05), carved
   out /firmware/ as a plain-HTTP exception here instead: a sibling `if`
   with `break` placed before certbot's own two redirect ifs, so a
   /firmware/ request never reaches them (nginx doesn't allow nesting `if`
   inside `if`, the first attempt here — worth re-checking this exception
   survives after any future `certbot renew`/`--nginx` run that touches
   this file). server.js itself now only listens on 127.0.0.1:3000 (see
   server.js's own comment) — nginx is the only way in from outside for
   either port now. */
server {
    /* nginx doesn't allow nesting "if" inside "if" — this has to be a
       sibling that stops the rewrite phase via break, not a wrapper around
       the two redirect ifs below (that was the first attempt, rejected at
       "nginx -t" with "if directive is not allowed here"). break here
       means the two redirect ifs below never run for a /firmware/ request. */
    if ($request_uri ~ ^/firmware/) {
        break;
    }

    if ($host = multihot.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = multihot.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    location /firmware/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 80;
    server_name multihot.duckdns.org multihot.online;
    return 404; # managed by Certbot
}
