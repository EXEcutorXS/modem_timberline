function cmdTable(lang){
  const i = {ru:0,en:1,de:2}[lang];
  const head = {ru:["Команда","Аргумент","Описание"], en:["Command","Argument","Description"], de:["Befehl","Argument","Beschreibung"]}[lang];
  const key = (r) => (lang === "de" ? r[1] : r[0]);
  const rows = CMDS.map(r => `<tr><td class="cmd">${key(r)}</td><td>${r[2+i]}</td><td>${r[5+i]}</td></tr>`).join("");
  return `<div class="tblwrap"><table class="tbl"><thead><tr><th>${head[0]}</th><th>${head[1]}</th><th>${head[2]}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function deKeywordTable(lang){
  const head = {ru:["Английская команда","Немецкая команда"], en:["English command","German command"], de:["Englischer Befehl","Deutscher Befehl"]}[lang];
  const rows = CMDS.filter(r => r[0] !== r[1]).map(r => `<tr><td class="cmd">${r[0]}</td><td class="cmd">${r[1]}</td></tr>`).join("");
  return `<div class="tblwrap"><table class="tbl" style="max-width:480px"><thead><tr><th>${head[0]}</th><th>${head[1]}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

    <ul>
      <li>С завода установлен PIN-код <b>1234</b>. Рекомендуем сменить его как можно скорее командой <span class="cmd">setpin</span>.</li>
      <li>Задайте номер администратора командой <span class="cmd">admin</span> с вашего телефона (пустой аргумент назначает администратором номер отправителя). С этого номера команды выполняются без PIN, и именно на него приходят сообщения о неисправностях.</li>
      <li>Дополнительные доверенные номера (до четырёх) задаются командами <span class="cmd">phone1</span>…<span class="cmd">phone4</span>. Они тоже работают без PIN, но аварийных сообщений не получают.</li>
      <li>Включите оповещение о неисправностях командой <span class="cmd">faultreport on</span>.</li>
    </ul>`},
   {id:"sms", title:"Управление по SMS", html:()=>`
    <p>Команда с незарегистрированного телефона должна выглядеть так: <span class="cmd">PIN команда аргумент</span>, например <span class="cmd">1234 burner on</span> или <span class="cmd">1234 admin +79608123398</span>.</p>
    <p>Команда с номера администратора (или доверенного номера) PIN не требует: <span class="cmd">z1 vent</span>, <span class="cmd">systimer 100</span>.</p>
    <ul>
      <li>«#» после «z» заменяется номером зоны.</li>
      <li>Регистр не важен: <span class="cmd">Burner on</span> и <span class="cmd">bUrNeR oN</span> — одно и то же.</li>
      <li>В одной SMS можно передать несколько команд через запятую: <span class="cmd">burner on,element on, z1 heat</span>.</li>
      <li>Команды можно подавать и по-немецки (<span class="cmd">brenner ein</span>); тогда и ответ придёт по-немецки. Не смешивайте английские и немецкие слова в одном сообщении.</li>
    </ul>
    ${cmdTable('ru')}
    <h3>Немецкие команды</h3>
    <p>Немецкие слова записаны без умлаутов (ae/oe/ue/ss вместо ä/ö/ü/ß), потому что SMS отправляется в 7-битной кодировке модема. Аргументы и значения, которых нет в таблице (номера телефонов, цифры PIN, режим «auto», числовые уставки и проценты, буквы c/f), пишутся одинаково на обоих языках.</p>
    ${deKeywordTable('ru')}`},
   {id:"internet", title:"Интернет и веб-управление", html:()=>`
    <p>По умолчанию модем управляется только по SMS. Включение интернета добавляет к этому управление и наблюдение из браузера.</p>
    <h3>Включение интернета</h3>
    <p>Отправьте <span class="cmd">internet 1</span>, чтобы перевести модем на мобильный интернет (MQTT). <span class="cmd">internet 0</span> возвращает работу только по SMS.</p>
    <h3>Настройка одной SMS</h3>
    <ol>
      <li>Откройте <a href="https://multihot.online">multihot.online</a> и зарегистрируйте учётную запись (логин и пароль на ваш выбор).</li>
      <li>Сайт покажет готовую SMS-команду, например <span class="cmd">server multihot.online,login myname,password mypass,getlink</span>. Отправьте её на номер SIM-карты модема в точности как показано.</li>
      <li>Модем применит все четыре настройки сразу и ответит ссылкой на страницу управления.</li>
      <li>Откройте ссылку и добавьте в закладки: её можно открывать в любое время, она всегда показывает живое состояние. Новая команда <span class="cmd">getlink</span> делает старую ссылку недействительной.</li>
    </ol>
    <h3>Автоматическая привязка с пульта</h3>
    <p>Привязать модем можно и без SMS: на экране «Статус интернета» пульта ПУ-28 кнопка <b>REG</b> запускает автоматическую регистрацию, после чего на пульте появляется QR-код со ссылкой для входа (кнопка <b>QR</b>). Отсканируйте его телефоном. Подробнее — в <a href="/pu28manual.html#modeminternet">руководстве на пульт</a>.</p>
    <h3>Роуминг</h3>
    <p>По умолчанию (<span class="cmd">roaming 0</span>) модем не использует мобильный интернет в роуминге, чтобы не создавать неожиданных расходов: при обнаружении роуминга соединение сразу разрывается, а SMS продолжают работать. Чтобы разрешить интернет в роуминге, отправьте <span class="cmd">roaming 1</span>.</p>
    <h3>Страница управления</h3>
    <p>Кнопки с иконками для горелки, ТЭНа, тёплого пола и подогрева двигателя (тёплый пол и двигатель появляются, только если это оборудование установлено). Переключатель ECO. Выбор зоны показывает только реально подключённые зоны; каждую зону можно переключить Выкл/Нагрев/Вентиляция (или только Выкл/Нагрев для радиатора без вентилятора) через меню из трёх точек в её углу, а цвет показывает текущее состояние. Дневная и ночная уставка и скорость вентилятора выбранной зоны меняются стрелками, колесом мыши или перетаскиванием вверх-вниз; долгое нажатие на вентилятор переключает автоматический и ручной режим. Таблица состояния показывает температуры бака, подогревателя и улицы, напряжение питания, состояние помп и активные коды неисправностей. Страница сама подстраивается под светлую или тёмную тему телефона или браузера.</p>`},
   {id:"timesync", title:"Синхронизация времени", html:()=>`
    <p>Модем может сам устанавливать время во всей системе по интернету. В веб-приложении откройте «Разное», включите <b>«Время из интернета»</b> и выберите <b>часовой пояс</b>. Обе настройки хранятся на сервере (брокере), поэтому модем получает их при каждом подключении, а в самом модеме ничего сохранять не нужно.</p>
    <ul>
      <li>Раз в 10 минут модем запрашивает точное время у NTP-сервера (pool.ntp.org) по мобильному интернету. Если интернета нет, время не меняется, а повторная попытка делается через минуту.</li>
      <li>Из выбранного пояса модем вычисляет местное время, в том числе автоматически переходит на летнее и обратно (правила ЕС и США; для остальных поясов перехода нет).</li>
      <li>Если системное время расходится с точным больше чем на 2 секунды, модем устанавливает его и рассылает по CAN всем устройствам системы — так же, как при ручной установке времени на пульте. Если время верное, ничего не отправляется.</li>
      <li>Рядом с переключателем видно результат последней проверки: «синхронизировано 08.10.26 14:32» или «ошибка синхронизации».</li>
      <li>Если при включённой синхронизации задать время вручную на пульте, то при ближайшей проверке (до 10 минут) модем вернёт точное время.</li>
    </ul>
    <p>Включив переключатель впервые, вы получите пояс, определённый по часам вашего браузера; при необходимости выберите другой. Функция доступна начиная с версии программы модема 121.0.0.19.</p>`},
   {id:"panel", title:"Модем на пульте", html:()=>`
    <p>Если модем подключён, на главном экране пульта ПУ-28 появляется значок модема. Его цвет показывает, как далеко продвинулось подключение:</p>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Цвет</th><th>Значение</th></tr></thead><tbody>
      <tr><td>Серый</td><td>Модем не подключён к системе.</td></tr>
      <tr><td>Синий</td><td>Модем подключён к системе.</td></tr>
      <tr><td>Голубой</td><td>Модем зарегистрирован в сотовой сети.</td></tr>
      <tr><td>Оранжевый</td><td>Модем подключён к интернету.</td></tr>
      <tr><td>Зелёный</td><td>Модем подключён к MQTT-брокеру (облачный сервис доступен).</td></tr>
    </tbody></table></div>
    <p>Нажатие на значок открывает экраны модема. Подробно они описаны в руководстве на пульт:</p>
    <ul>
      <li><a href="/pu28manual.html#modeminfo">Статус модема</a> — регистрация, роуминг, уровень сигнала, оператор, IMEI, последняя SMS;</li>
      <li><a href="/pu28manual.html#modemsettings">Настройки модема</a> — «Только SMS», «Только 2G» (2G autofallback), «Роуминг», «SMS неиспр.», «Подтв. команд»;</li>
      <li><a href="/pu28manual.html#modeminternet">Статус интернета</a> — интернет, MQTT, режим сети, адрес проверки, брокер, логин, пароль, кнопки REG и QR;</li>
      <li><a href="/pu28manual.html#modemqr">QR-код привязки</a>.</li>
    </ul>`},
   {id:"ussd", title:"USSD-запросы", html:()=>`
    <p>Модем работает как USSD-мост. Чтобы выполнить USSD-запрос, отправьте <b>с номера администратора</b> SMS вида <span class="cmd">ussd *100#</span>. Код состоит только из цифр и символов <span class="cmd">* # +</span>. Модем перешлёт запрос оператору, а ответ придёт ответной SMS. Функция доступна начиная с версии программы модема 121.0.0.18.</p>
    <ul>
      <li>Команда принимается только от номера администратора: USSD-запрос может быть платным (пополнение, услуги), поэтому доверенные номера и сообщения с PIN-кодом не подходят.</li>
      <li>Ответ приходит одной SMS (до 140 символов). Русский текст передаётся транслитом, немецкие умляуты — как ae/oe/ue/ss, так как SMS модема отправляются в 7-битной кодировке.</li>
      <li>Если оператор не ответил за 40 секунд, придёт «USSD: no reply»; если запрос отклонён — «USSD: error».</li>
      <li>Пока предыдущий запрос не завершён, новый не принимается («USSD: busy»).</li>
      <li>Интерактивные меню (когда оператор ждёт выбора пункта) не поддерживаются — возвращается только первый ответ.</li>
    </ul>`},
   {id:"trouble", title:"Если что-то не работает", html:()=>`
    <p>Сначала посмотрите цвет значка модема на главном экране пульта и экран «Статус интернета».</p>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Что видно</th><th>Что проверить</th></tr></thead><tbody>
      <tr><td>Значок серый</td><td>Модем не отвечает по CAN. Проверьте питание модема, провода CAN и общую массу; помните, что устройства соединяют по CAN только после подачи питания.</td></tr>
      <tr><td>Значок синий (нет регистрации в сети)</td><td>SIM-карта вставлена и активна, антенна подключена, есть покрытие оператора (уровень сигнала на экране «Статус модема»).</td></tr>
      <tr><td>Значок голубой (регистрация есть, интернета нет)</td><td>Не включён ли режим «Только SMS» и включён ли интернет (<span class="cmd">internet 1</span>). Если вы в роуминге — разрешите его (<span class="cmd">roaming 1</span>): по умолчанию в роуминге интернет запрещён, а SMS при этом работают. Проверьте тариф и баланс для передачи данных. При необходимости задайте APN оператора командами <span class="cmd">apn</span>, <span class="cmd">apnuser</span>, <span class="cmd">apnpass</span>. Если по одному из режимов (2G или 4G) данные не проходят, включите «2G autofallback» (<span class="cmd">2g on</span>): модем сам будет менять режим каждые 10 минут, пока интернет не появится.</td></tr>
      <tr><td>Значок оранжевый (интернет есть, брокера нет)</td><td>Проверьте адрес сервера, логин и пароль на экране «Статус интернета» (<span class="cmd">server</span>, <span class="cmd">login</span>, <span class="cmd">password</span>), при необходимости повторите привязку (<span class="cmd">getlink</span> или кнопка REG).</td></tr>
      <tr><td>Модем не отвечает на SMS</td><td>Правильность PIN или отправка с номера администратора, баланс SIM-карты, команда набрана верно (регистр не важен). Для проверки связи отправьте <span class="cmd">ping</span> — в ответ придёт «pong».</td></tr>
      <tr><td>Сам собой перестал работать интернет</td><td>Отправьте <span class="cmd">reset</span>, чтобы перезагрузить модем. Если не помогает — обратитесь в сервис.</td></tr>
    </tbody></table></div>`},
   {id:"update", title:"Обновление программы", html:()=>`
    <p>Версию программы модема можно посмотреть на экране «Версии прошивки» пульта (строка «Модем») и в веб-приложении. Обновление выполняется по сети из веб-приложения либо с помощью программы CAN Tool; обновлять устройства следует только версиями, предназначенными для их типа.</p>`}
  ]
},
en: {
  docTitle:"MultiHot modem — manual",
  crumb:"Manuals",
  eyebrow:"User guide",
  h1:"MultiHot modem",
  lede:"Control the heating system by SMS and over the internet: commands, the web app, indication, setup and troubleshooting.",
  tocLabel:"Contents",
  footer:"This guide covers the MultiHot system modem (device type 121). The modem screens on the PU-28 panel are described in the <a href=\"/pu28manual.html\">panel manual</a>.",
  sections:[
   {id:"overview", title:"Purpose", html:()=>`
    <p>The modem connects to the heating system's CAN bus as one more device and lets you control the system and monitor its state remotely:</p>
    <ul>
      <li><b>by SMS</b> — switch the burner, element and zones on and off, change setpoints, request the status; on a fault the modem sends an SMS with the error code by itself;</li>
      <li><b>over the internet</b> — from a web app on a phone or computer, with live system status;</li>
      <li><b>USSD</b> — the modem can forward a USSD request (for example a balance check) and return the answer by SMS.</li>
    </ul>
    <p>SMS control always works. Internet control is enabled separately (see “Internet &amp; web control”); with internet off the modem works by SMS only.</p>`},
   {id:"connect", title:"Connection", html:()=>`
    <p>The modem is connected to the heating system's CAN bus like the other devices (see <a href="/manual-system.html#can">section 7.5 of the system manual</a>, Russian).</p>
    <div class="warn"><b class="t">Attention</b>Connect devices to the CAN bus only after power is applied. The system's CAN bus must not be joined to the vehicle's CAN bus.</div>
    <p>You need a SIM card with SMS and mobile data enabled (if you plan to use internet control) and the modem antenna. After power-up the modem registers in the cellular network by itself; progress is visible on the panel (modem icon colour, the “Modem status” and “Internet status” screens) and on the LED.</p>`},
   {id:"indication", title:"LED and button", html:()=>`
    <h3>LED</h3>
    <p>Only the yellow channel is used for this; the green channel is unlit.</p>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>LED state</th><th>Meaning</th></tr></thead><tbody>
      <tr><td>Off</td><td>Neither the burner nor the electric element is on, and there is no active fault.</td></tr>
      <tr><td>Smooth breathing pulse</td><td>The burner (liquid heater) is on, alone.</td></tr>
      <tr><td>Slow blink (2 s on / 2 s off)</td><td>The electric heating element is on, alone.</td></tr>
      <tr><td>Steady on</td><td>Both the burner and the electric element are on together.</td></tr>
      <tr><td>Blinks out the fault code</td><td>At least one fault is active — takes priority over every state above. The LED blinks the code of the first active fault digit by digit (hundreds, then tens, then units; a leading zero digit contributes only its pause, no flashes). A short pause separates digits, a long pause precedes the sequence repeating. The exact code can also be read from the fault SMS or the system status.</td></tr>
    </tbody></table></div>
    <p>The state of the floor zones and the engine does not affect the LED.</p>
    <h3>Button</h3>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Press</th><th>Action</th></tr></thead><tbody>
      <tr><td>Short press</td><td>Cycles the burner/electric-element combination one step forward: burner → element → burner+element → burner → … Also turns on all heating zones (heat mode).</td></tr>
      <tr><td>Long press</td><td>Turns everything off (burner, element, all zones, underfloor heating, engine preheat). The next short press restarts the cycle from “burner”.</td></tr>
      <tr><td>Very long press (10 s)</td><td>Factory reset: erases all settings back to defaults and reboots. The heater is already off by this point (the long press fires first, at about 1.5 s). The green LED stays off for the whole hold and only starts blinking once the reset has already happened.</td></tr>
    </tbody></table></div>`},
   {id:"security", title:"First start and security", html:()=>`
    <ul>
      <li>The device ships with the default PIN <b>1234</b>. We strongly recommend changing it as soon as possible with <span class="cmd">setpin</span>.</li>
      <li>Set the admin number by sending <span class="cmd">admin</span> from your phone (an empty argument designates the sender's phone as admin). Commands from this number need no PIN, and fault messages are sent to it.</li>
      <li>Up to four additional trusted numbers are set with <span class="cmd">phone1</span>…<span class="cmd">phone4</span>. They also work without a PIN but do not receive fault messages.</li>
      <li>Enable fault notifications with <span class="cmd">faultreport on</span>.</li>
    </ul>`},
   {id:"sms", title:"SMS control", html:()=>`
    <p>A command from an unregistered phone must look like <span class="cmd">PIN command argument</span>, for example <span class="cmd">1234 burner on</span> or <span class="cmd">1234 admin +79608123398</span>.</p>
    <p>A command from the admin number (or a trusted number) does not need the PIN: <span class="cmd">z1 vent</span>, <span class="cmd">systimer 100</span>.</p>
    <ul>
      <li>“#” after “z” must be replaced with a zone number.</li>
      <li>Commands are case-insensitive: <span class="cmd">Burner on</span> and <span class="cmd">bUrNeR oN</span> mean the same thing.</li>
      <li>A single SMS may contain several commands separated by commas: <span class="cmd">burner on,element on, z1 heat</span>.</li>
      <li>Commands may also be given in German (<span class="cmd">brenner ein</span>); the reply is then German as well. Do not mix English and German words in one message.</li>
    </ul>
    ${cmdTable('en')}
    <h3>German keywords</h3>
    <p>German keywords intentionally avoid umlauts (ae/oe/ue/ss instead of ä/ö/ü/ß), since SMS is sent using the modem's 7-bit character set. Arguments and values not listed here (phone numbers, PIN digits, the “auto” fan mode, numeric setpoints and percentages, “c”/“f” unit letters) are written the same way in both languages.</p>
    ${deKeywordTable('en')}`},
   {id:"internet", title:"Internet & web control", html:()=>`
    <p>By default the modem is controlled by SMS only. Enabling internet lets you also monitor and control it from a web browser, on top of everything SMS already does.</p>
    <h3>Enabling internet</h3>
    <p>Send <span class="cmd">internet 1</span> to switch the modem onto mobile internet (MQTT). Send <span class="cmd">internet 0</span> to go back to SMS-only.</p>
    <h3>One-SMS setup</h3>
    <ol>
      <li>Open <a href="https://multihot.online">multihot.online</a> and register an account (choose a login and password).</li>
      <li>The site shows a ready-made SMS command, for example <span class="cmd">server multihot.online,login myname,password mypass,getlink</span> — send it to the modem's SIM phone number exactly as shown.</li>
      <li>The modem applies all four settings at once and replies with a link to the control page.</li>
      <li>Open the link and bookmark it — it can be reopened at any time and always shows live status. Sending a new <span class="cmd">getlink</span> invalidates the old link.</li>
    </ol>
    <h3>Automatic pairing from the panel</h3>
    <p>The modem can also be paired without SMS: on the PU-28's “Internet status” screen the <b>REG</b> button starts automatic registration, after which a QR code with the login link appears on the panel (the <b>QR</b> button). Scan it with your phone. More in the <a href="/pu28manual.html#modeminternet">panel manual</a>.</p>
    <h3>Roaming</h3>
    <p>By default (<span class="cmd">roaming 0</span>) the modem will not use mobile internet while roaming on a foreign network, to avoid unexpected data charges — the connection is torn down immediately if roaming is detected, while SMS keeps working. Send <span class="cmd">roaming 1</span> to allow it anyway.</p>
    <h3>The web control page</h3>
    <p>Icon buttons for Heater, Element, Floor and Engine — Floor/Engine only appear if that hardware is actually installed. An Eco switch. A zone selector showing only the zones actually connected; each zone can be switched Off/Heat/Vent (or just Off/Heat for a radiator zone with no fan) via the three-dot menu button in its corner, and is colour-coded by its current state. Day/night setpoint and fan-speed controls for the selected zone — use the arrows, scroll, or drag up/down to adjust; long-press the fan control to switch it between automatic and manual. A live status table with tank/heater/outdoor temperature, supply voltage, pump states, and any active fault codes. The page automatically matches your phone or browser's light/dark theme.</p>`},
   {id:"timesync", title:"Time synchronization", html:()=>`
    <p>The modem can set the time across the whole system from the internet. In the web app open “Misc”, turn on <b>“Time from internet”</b> and choose the <b>time zone</b>. Both settings are stored on the server (the broker), so the modem receives them on every connection and nothing has to be saved in the modem itself.</p>
    <ul>
      <li>Every 10 minutes the modem asks an NTP server (pool.ntp.org) for the exact time over the mobile internet. With no internet the time is left alone and the attempt is repeated after a minute.</li>
      <li>From the chosen zone the modem works out local time, including automatic switching to summer time and back (EU and US rules; other zones have no switching).</li>
      <li>If the system time differs from the exact time by more than 2 seconds, the modem sets it and broadcasts it on the CAN bus to every device in the system — the same way a manual time setup on the panel does. If the time is right, nothing is sent.</li>
      <li>Next to the switch you can see the result of the last check: “synced 08.10.26 14:32” or “sync error”.</li>
      <li>If you set the time by hand on the panel while synchronization is on, the modem puts the exact time back at the next check (within 10 minutes).</li>
    </ul>
    <p>The first time you turn the switch on you get the zone detected from your browser's clock; pick another one if needed. Available from modem software version 121.0.0.19.</p>`},
   {id:"panel", title:"The modem on the panel", html:()=>`
    <p>When a modem is connected, a modem icon appears on the PU-28's home screen. Its colour shows how far the connection has got:</p>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Colour</th><th>Meaning</th></tr></thead><tbody>
      <tr><td>Gray</td><td>Modem is not connected to the system.</td></tr>
      <tr><td>Blue</td><td>Modem is connected to the system.</td></tr>
      <tr><td>Cyan</td><td>Modem is registered in the cellular network.</td></tr>
      <tr><td>Orange</td><td>Modem is connected to the internet.</td></tr>
      <tr><td>Green</td><td>Modem is connected to the MQTT broker (cloud service available).</td></tr>
    </tbody></table></div>
    <p>Tapping the icon opens the modem screens, described in detail in the panel manual:</p>
    <ul>
      <li><a href="/pu28manual.html#modeminfo">Modem status</a> — registration, roaming, signal, operator, IMEI, last SMS;</li>
      <li><a href="/pu28manual.html#modemsettings">Modem settings</a> — “Only SMS”, “Only 2G” (2G autofallback), “Roaming”, “Fault SMS”, “Cmd ack.”;</li>
      <li><a href="/pu28manual.html#modeminternet">Internet status</a> — internet, MQTT, network mode, check URL, broker, login, password, REG and QR buttons;</li>
      <li><a href="/pu28manual.html#modemqr">Pairing QR code</a>.</li>
    </ul>`},
   {id:"ussd", title:"USSD requests", html:()=>`
    <p>The modem works as a USSD bridge. To make a USSD request, send an SMS such as <span class="cmd">ussd *100#</span> <b>from the admin number</b>. The code may contain only digits and <span class="cmd">* # +</span>. The modem forwards the request to the operator and the answer comes back as a reply SMS. Available from modem software version 121.0.0.18.</p>
    <ul>
      <li>The command is accepted only from the admin number: a USSD request can cost money (top-ups, paid services), so trusted numbers and PIN-prefixed messages are not enough.</li>
      <li>The answer arrives as a single SMS (up to 140 characters). Cyrillic text is transliterated and German umlauts become ae/oe/ue/ss, because the modem sends SMS in a 7-bit charset.</li>
      <li>If the operator does not answer within 40 seconds you get “USSD: no reply”; if the request is rejected, “USSD: error”.</li>
      <li>While a previous request is still in progress a new one is refused (“USSD: busy”).</li>
      <li>Interactive menus (where the operator waits for a choice) are not supported — only the first answer is returned.</li>
    </ul>`},
   {id:"trouble", title:"Troubleshooting", html:()=>`
    <p>Start with the colour of the modem icon on the panel's home screen and the “Internet status” screen.</p>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>What you see</th><th>What to check</th></tr></thead><tbody>
      <tr><td>Icon is gray</td><td>The modem does not answer on CAN. Check the modem's power, the CAN wires and the common ground; remember that devices are joined on CAN only after power is applied.</td></tr>
      <tr><td>Icon is blue (not registered)</td><td>The SIM card is inserted and active, the antenna is connected, and there is operator coverage (signal level on the “Modem status” screen).</td></tr>
      <tr><td>Icon is cyan (registered, no internet)</td><td>Whether “Only SMS” is off and internet is enabled (<span class="cmd">internet 1</span>). If you are roaming, allow it (<span class="cmd">roaming 1</span>): by default internet is forbidden in roaming while SMS keeps working. Check the data plan and balance. If needed, set the operator's APN with <span class="cmd">apn</span>, <span class="cmd">apnuser</span>, <span class="cmd">apnpass</span>. If data does not get through on one of the modes (2G or 4G), turn on “2G autofallback” (<span class="cmd">2g on</span>): the modem then changes mode every 10 minutes by itself until the internet works.</td></tr>
      <tr><td>Icon is orange (internet, no broker)</td><td>Check the server address, login and password on the “Internet status” screen (<span class="cmd">server</span>, <span class="cmd">login</span>, <span class="cmd">password</span>); repeat the pairing if needed (<span class="cmd">getlink</span> or the REG button).</td></tr>
      <tr><td>No reply to SMS</td><td>Correct PIN or sending from the admin number, SIM balance, command typed correctly (case does not matter). To test the link, send <span class="cmd">ping</span> — the reply is “pong”.</td></tr>
      <tr><td>Internet stopped working by itself</td><td>Send <span class="cmd">reset</span> to reboot the modem. If that does not help, contact service.</td></tr>
    </tbody></table></div>`},
   {id:"update", title:"Software update", html:()=>`
    <p>The modem's software version is shown on the panel's “Firmware versions” screen (the “Modem” line) and in the web app. Updates are done over the network from the web app or with the CAN Tool program; always update devices only with versions built for their type.</p>`}
  ]
},
de: {
  docTitle:"MultiHot-Modem — Anleitung",
  crumb:"Anleitungen",
  eyebrow:"Benutzerhandbuch",
  h1:"MultiHot-Modem",
  lede:"Steuerung des Heizsystems per SMS und über das Internet: Befehle, Web-App, Anzeige, Einrichtung und Fehlersuche.",
  tocLabel:"Inhalt",
  footer:"Diese Anleitung gilt für das Modem des MultiHot-Systems (Gerätetyp 121). Die Modem-Bildschirme am PU-28-Panel sind in der <a href=\"/pu28manual.html\">Panel-Anleitung</a> beschrieben.",
  sections:[
   {id:"overview", title:"Zweck", html:()=>`
    <p>Das Modem wird als weiteres Gerät an den CAN-Bus des Heizsystems angeschlossen und ermöglicht es, das System aus der Ferne zu steuern und zu überwachen:</p>
    <ul>
      <li><b>per SMS</b> — Brenner, Heizstab und Zonen ein- und ausschalten, Sollwerte ändern, Status abfragen; bei einer Störung sendet das Modem selbst eine SMS mit dem Fehlercode;</li>
      <li><b>über das Internet</b> — mit einer Web-App auf Telefon oder Computer, mit Live-Status des Systems;</li>
      <li><b>USSD</b> — das Modem kann eine USSD-Anfrage (z. B. Guthabenabfrage) weiterleiten und die Antwort per SMS zurückschicken.</li>
    </ul>
    <p>Die SMS-Steuerung funktioniert immer. Die Internet-Steuerung wird separat aktiviert (siehe „Internet &amp; Web-Steuerung“); bei ausgeschaltetem Internet arbeitet das Modem nur per SMS.</p>`},
   {id:"connect", title:"Anschluss", html:()=>`
    <p>Das Modem wird wie die übrigen Geräte an den CAN-Bus des Heizsystems angeschlossen (siehe <a href="/manual-system.html#can">Abschnitt 7.5 der Systemanleitung</a>, auf Russisch).</p>
    <div class="warn"><b class="t">Achtung</b>Geräte erst nach dem Einschalten der Stromversorgung am CAN-Bus verbinden. Der CAN-Bus des Systems darf nicht mit dem CAN-Bus des Fahrzeugs verbunden werden.</div>
    <p>Erforderlich sind eine SIM-Karte mit aktivierten SMS und mobilen Daten (bei Internet-Steuerung) sowie die Modem-Antenne. Nach dem Einschalten meldet sich das Modem selbständig im Mobilfunknetz an; der Fortschritt ist am Panel (Farbe des Modem-Symbols, Bildschirme „Modemstatus“ und „Internetstatus“) und an der LED erkennbar.</p>`},
   {id:"indication", title:"LED und Taste", html:()=>`
    <h3>LED</h3>
    <p>Verwendet wird nur der gelbe Kanal; der grüne Kanal leuchtet nicht.</p>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>LED-Zustand</th><th>Bedeutung</th></tr></thead><tbody>
      <tr><td>Aus</td><td>Weder Brenner noch Heizstab sind an, und es liegt keine Störung vor.</td></tr>
      <tr><td>Weiches „Atmen“</td><td>Nur der Brenner (Flüssigkeitsheizung) ist an.</td></tr>
      <tr><td>Langsames Blinken (2 s an / 2 s aus)</td><td>Nur der elektrische Heizstab ist an.</td></tr>
      <tr><td>Dauerleuchten</td><td>Brenner und Heizstab sind gleichzeitig an.</td></tr>
      <tr><td>Blinkt den Fehlercode</td><td>Mindestens eine Störung ist aktiv — hat Vorrang vor allen anderen Zuständen. Die LED blinkt den Code der ersten aktiven Störung Ziffer für Ziffer (Hunderter, Zehner, Einer; eine Null ergibt nur eine Pause ohne Blitze). Eine kurze Pause trennt die Ziffern, eine lange Pause geht der Wiederholung voraus. Der genaue Code ist auch der Stör-SMS oder dem Systemstatus zu entnehmen.</td></tr>
    </tbody></table></div>
    <p>Der Zustand der Fußbodenzonen und des Motors beeinflusst die LED nicht.</p>
    <h3>Taste</h3>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Betätigung</th><th>Aktion</th></tr></thead><tbody>
      <tr><td>Kurz</td><td>Schaltet die Kombination Brenner/Heizstab einen Schritt weiter: Brenner → Heizstab → Brenner+Heizstab → Brenner → … Schaltet außerdem alle Heizzonen ein (Heizmodus).</td></tr>
      <tr><td>Lang</td><td>Schaltet alles aus (Brenner, Heizstab, alle Zonen, Fußbodenheizung, Motorvorwärmung). Der nächste kurze Druck beginnt den Zyklus wieder bei „Brenner“.</td></tr>
      <tr><td>Sehr lang (10 s)</td><td>Werksreset: setzt alle Einstellungen auf Standardwerte zurück und startet neu. Die Heizung ist zu diesem Zeitpunkt bereits aus (der lange Druck wirkt zuerst, bei etwa 1,5 s). Die grüne LED bleibt während des gesamten Haltens aus und beginnt erst zu blinken, wenn der Reset bereits erfolgt ist.</td></tr>
    </tbody></table></div>`},
   {id:"security", title:"Erste Inbetriebnahme und Sicherheit", html:()=>`
    <ul>
      <li>Das Gerät wird mit der Standard-PIN <b>1234</b> ausgeliefert. Wir empfehlen dringend, sie so bald wie möglich mit <span class="cmd">pin</span> zu ändern.</li>
      <li>Legen Sie die Admin-Nummer fest, indem Sie von Ihrem Telefon <span class="cmd">admin</span> senden (ein leeres Argument setzt die Nummer des Absenders als Admin). Befehle von dieser Nummer benötigen keine PIN, und Störungsmeldungen werden an sie gesendet.</li>
      <li>Bis zu vier weitere vertrauenswürdige Nummern werden mit <span class="cmd">telefon1</span>…<span class="cmd">telefon4</span> festgelegt. Sie funktionieren ebenfalls ohne PIN, erhalten aber keine Störungsmeldungen.</li>
      <li>Aktivieren Sie die Störungsmeldung mit <span class="cmd">fehlermeldung ein</span>.</li>
    </ul>`},
   {id:"sms", title:"SMS-Steuerung", html:()=>`
    <p>Ein Befehl von einem nicht registrierten Telefon muss so aussehen: <span class="cmd">PIN Befehl Argument</span>, zum Beispiel <span class="cmd">1234 brenner ein</span> oder <span class="cmd">1234 admin +49...</span>.</p>
    <p>Ein Befehl von der Admin-Nummer (oder einer vertrauenswürdigen Nummer) benötigt keine PIN: <span class="cmd">z1 lueften</span>, <span class="cmd">systemzeit 100</span>.</p>
    <ul>
      <li>„#“ nach „z“ ist durch die Zonennummer zu ersetzen.</li>
      <li>Groß-/Kleinschreibung spielt keine Rolle.</li>
      <li>Eine SMS kann mehrere Befehle enthalten, durch Kommas getrennt: <span class="cmd">brenner ein,heizstab ein, z1 heizen</span>.</li>
      <li>Befehle können auch auf Englisch gegeben werden; die Antwort kommt dann auf Englisch. Englische und deutsche Schlüsselwörter sollten in einer Nachricht nicht gemischt werden.</li>
    </ul>
    <p>Deutsche Schlüsselwörter verzichten absichtlich auf Umlaute (ae/oe/ue/ss statt ä/ö/ü/ß), da SMS im 7-Bit-Zeichensatz des Modems gesendet werden. Nicht aufgeführte Argumente und Werte (Telefonnummern, PIN-Ziffern, der Lüftermodus „auto“, numerische Sollwerte und Prozentwerte, die Einheitenbuchstaben „c“/„f“) werden in beiden Sprachen gleich geschrieben.</p>
    ${cmdTable('de')}`},
   {id:"internet", title:"Internet & Web-Steuerung", html:()=>`
    <p>Standardmäßig wird das Modem nur per SMS gesteuert. Mit aktiviertem Internet kann es zusätzlich im Webbrowser überwacht und gesteuert werden.</p>
    <h3>Internet aktivieren</h3>
    <p>Senden Sie <span class="cmd">internet ein</span>, um das Modem auf mobiles Internet (MQTT) umzuschalten. <span class="cmd">internet aus</span> kehrt zum reinen SMS-Betrieb zurück.</p>
    <h3>Einrichtung mit einer SMS</h3>
    <ol>
      <li>Öffnen Sie <a href="https://multihot.online">multihot.online</a> und registrieren Sie ein Konto (Login und Passwort frei wählbar).</li>
      <li>Die Seite zeigt eine fertige SMS, z. B. <span class="cmd">server multihot.online,login myname,password mypass,getlink</span> — senden Sie sie genau so an die Rufnummer der SIM-Karte des Modems.</li>
      <li>Das Modem übernimmt alle vier Einstellungen auf einmal und antwortet mit einem Link zur Steuerungsseite.</li>
      <li>Öffnen Sie den Link und speichern Sie ihn als Lesezeichen — er kann jederzeit erneut geöffnet werden und zeigt immer den Live-Status. Ein neues <span class="cmd">getlink</span> macht den alten Link ungültig.</li>
    </ol>
    <h3>Automatische Kopplung am Panel</h3>
    <p>Das Modem kann auch ohne SMS gekoppelt werden: Auf dem Bildschirm „Internetstatus“ des PU-28 startet die Taste <b>REG</b> die automatische Registrierung; danach erscheint am Panel ein QR-Code mit dem Anmelde-Link (Taste <b>QR</b>). Scannen Sie ihn mit dem Telefon. Mehr in der <a href="/pu28manual.html#modeminternet">Panel-Anleitung</a>.</p>
    <h3>Roaming</h3>
    <p>Standardmäßig (<span class="cmd">roaming aus</span>) nutzt das Modem im Roaming kein mobiles Internet, um unerwartete Datenkosten zu vermeiden — die Verbindung wird sofort getrennt, wenn Roaming erkannt wird; SMS funktionieren weiter. Mit <span class="cmd">roaming ein</span> erlauben Sie es trotzdem.</p>
    <h3>Die Web-Steuerungsseite</h3>
    <p>Symbol-Tasten für Brenner, Heizstab, Fußboden und Motor — Fußboden/Motor erscheinen nur, wenn die Hardware tatsächlich vorhanden ist. Ein Eco-Schalter. Eine Zonenauswahl zeigt nur die tatsächlich angeschlossenen Zonen; jede Zone kann über die Drei-Punkte-Schaltfläche in ihrer Ecke auf Aus/Heizen/Lüften (oder nur Aus/Heizen bei einer Heizkörperzone ohne Lüfter) geschaltet werden und ist je nach Zustand farbig markiert. Tag-/Nacht-Sollwert und Lüfterdrehzahl der gewählten Zone werden mit Pfeilen, Mausrad oder Ziehen nach oben/unten eingestellt; ein langer Druck auf den Lüfter schaltet zwischen automatisch und manuell um. Eine Live-Statustabelle zeigt Tank-/Heizungs-/Außentemperatur, Versorgungsspannung, Pumpenzustände und aktive Fehlercodes. Die Seite passt sich automatisch dem hellen/dunklen Design von Telefon oder Browser an.</p>`},
   {id:"timesync", title:"Zeitsynchronisation", html:()=>`
    <p>Das Modem kann die Uhrzeit im gesamten System aus dem Internet einstellen. Öffnen Sie in der Web-App „Sonstiges“, schalten Sie <b>„Zeit aus dem Internet“</b> ein und wählen Sie die <b>Zeitzone</b>. Beide Einstellungen werden auf dem Server (Broker) gespeichert; das Modem erhält sie bei jeder Verbindung, im Modem selbst muss nichts gespeichert werden.</p>
    <ul>
      <li>Alle 10 Minuten fragt das Modem über das mobile Internet die genaue Zeit bei einem NTP-Server (pool.ntp.org) ab. Ohne Internet bleibt die Uhrzeit unverändert, nach einer Minute wird es erneut versucht.</li>
      <li>Aus der gewählten Zone berechnet das Modem die Ortszeit, einschließlich automatischer Umstellung auf Sommerzeit und zurück (EU- und US-Regeln; andere Zonen haben keine Umstellung).</li>
      <li>Weicht die Systemzeit um mehr als 2 Sekunden von der genauen Zeit ab, stellt das Modem sie ein und sendet sie per CAN an alle Geräte des Systems — genauso wie die manuelle Zeiteinstellung am Panel. Stimmt die Zeit, wird nichts gesendet.</li>
      <li>Neben dem Schalter sehen Sie das Ergebnis der letzten Prüfung: „synchronisiert 08.10.26 14:32“ oder „Synchronisierung fehlgeschlagen“.</li>
      <li>Wird die Zeit bei eingeschalteter Synchronisation am Panel von Hand gestellt, setzt das Modem bei der nächsten Prüfung (innerhalb von 10 Minuten) die genaue Zeit wieder.</li>
    </ul>
    <p>Beim ersten Einschalten erhalten Sie die aus der Browseruhr ermittelte Zeitzone; wählen Sie bei Bedarf eine andere. Verfügbar ab Modem-Softwareversion 121.0.0.19.</p>`},
   {id:"panel", title:"Das Modem am Panel", html:()=>`
    <p>Ist ein Modem angeschlossen, erscheint auf dem Startbildschirm des PU-28 ein Modem-Symbol. Seine Farbe zeigt, wie weit die Verbindung gekommen ist:</p>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Farbe</th><th>Bedeutung</th></tr></thead><tbody>
      <tr><td>Grau</td><td>Modem ist nicht mit dem System verbunden.</td></tr>
      <tr><td>Blau</td><td>Modem ist mit dem System verbunden.</td></tr>
      <tr><td>Cyan</td><td>Modem ist im Mobilfunknetz registriert.</td></tr>
      <tr><td>Orange</td><td>Modem hat Internetverbindung.</td></tr>
      <tr><td>Grün</td><td>Modem ist mit dem MQTT-Broker verbunden (Cloud-Dienst verfügbar).</td></tr>
    </tbody></table></div>
    <p>Ein Tipp auf das Symbol öffnet die Modem-Bildschirme, die in der Panel-Anleitung ausführlich beschrieben sind:</p>
    <ul>
      <li><a href="/pu28manual.html#modeminfo">Modemstatus</a> — Registrierung, Roaming, Signal, Anbieter, IMEI, letzte SMS;</li>
      <li><a href="/pu28manual.html#modemsettings">Modem-Einstellungen</a> — „Nur SMS“, „Nur 2G“ (2G-Fallback), „Roaming“, „Störungs-SMS“, „Befehlsbestätigung“;</li>
      <li><a href="/pu28manual.html#modeminternet">Internetstatus</a> — Internet, MQTT, Netzmodus, Prüf-URL, Broker, Login, Passwort, Tasten REG und QR;</li>
      <li><a href="/pu28manual.html#modemqr">QR-Code zur Kopplung</a>.</li>
    </ul>`},
   {id:"ussd", title:"USSD-Anfragen", html:()=>`
    <p>Das Modem arbeitet als USSD-Brücke. Für eine USSD-Anfrage senden Sie <b>von der Admin-Nummer</b> eine SMS wie <span class="cmd">ussd *100#</span>. Der Code darf nur Ziffern und <span class="cmd">* # +</span> enthalten. Das Modem leitet die Anfrage an den Anbieter weiter, und die Antwort kommt als SMS zurück. Verfügbar ab Modem-Softwareversion 121.0.0.18.</p>
    <ul>
      <li>Der Befehl wird nur von der Admin-Nummer akzeptiert: Eine USSD-Anfrage kann Geld kosten (Aufladungen, kostenpflichtige Dienste); vertrauenswürdige Nummern und Nachrichten mit PIN genügen nicht.</li>
      <li>Die Antwort kommt als eine einzelne SMS (bis zu 140 Zeichen). Kyrillischer Text wird transliteriert, Umlaute werden zu ae/oe/ue/ss, da das Modem SMS im 7-Bit-Zeichensatz sendet.</li>
      <li>Antwortet der Anbieter nicht innerhalb von 40 Sekunden, kommt „USSD: no reply“; wird die Anfrage abgelehnt, „USSD: error“.</li>
      <li>Solange eine vorherige Anfrage läuft, wird keine neue angenommen („USSD: busy“).</li>
      <li>Interaktive Menüs (der Anbieter wartet auf eine Auswahl) werden nicht unterstützt — nur die erste Antwort wird zurückgegeben.</li>
    </ul>`},
   {id:"trouble", title:"Fehlersuche", html:()=>`
    <p>Beginnen Sie mit der Farbe des Modem-Symbols auf dem Startbildschirm des Panels und dem Bildschirm „Internetstatus“.</p>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Was zu sehen ist</th><th>Was zu prüfen ist</th></tr></thead><tbody>
      <tr><td>Symbol grau</td><td>Das Modem antwortet nicht am CAN. Stromversorgung des Modems, CAN-Leitungen und gemeinsame Masse prüfen; Geräte werden erst nach dem Einschalten am CAN verbunden.</td></tr>
      <tr><td>Symbol blau (nicht registriert)</td><td>SIM-Karte eingesetzt und aktiv, Antenne angeschlossen, Netzabdeckung vorhanden (Signalstärke auf dem Bildschirm „Modemstatus“).</td></tr>
      <tr><td>Symbol cyan (registriert, kein Internet)</td><td>Ist „Nur SMS“ aus und das Internet aktiviert (<span class="cmd">internet ein</span>)? Im Roaming erlauben Sie es mit <span class="cmd">roaming ein</span>: standardmäßig ist Internet im Roaming gesperrt, während SMS weiter funktionieren. Datentarif und Guthaben prüfen. Bei Bedarf den APN des Anbieters mit <span class="cmd">apn</span>, <span class="cmd">apnuser</span>, <span class="cmd">apnpass</span> setzen. Kommen auf einem der Modi (2G oder 4G) keine Daten durch, schalten Sie „2G-Fallback“ ein (<span class="cmd">2g ein</span>): das Modem wechselt dann alle 10 Minuten selbständig den Modus, bis das Internet funktioniert.</td></tr>
      <tr><td>Symbol orange (Internet, kein Broker)</td><td>Serveradresse, Login und Passwort auf dem Bildschirm „Internetstatus“ prüfen (<span class="cmd">server</span>, <span class="cmd">login</span>, <span class="cmd">password</span>); bei Bedarf Kopplung wiederholen (<span class="cmd">getlink</span> oder Taste REG).</td></tr>
      <tr><td>Keine Antwort auf SMS</td><td>Richtige PIN oder Absenden von der Admin-Nummer, SIM-Guthaben, Befehl korrekt geschrieben. Zum Testen <span class="cmd">ping</span> senden — Antwort: „pong“.</td></tr>
      <tr><td>Internet funktioniert plötzlich nicht mehr</td><td>Mit <span class="cmd">neustart</span> das Modem neu starten. Hilft das nicht, den Service kontaktieren.</td></tr>
    </tbody></table></div>`},
   {id:"update", title:"Software-Update", html:()=>`
    <p>Die Softwareversion des Modems wird auf dem Bildschirm „Firmware-Versionen“ des Panels (Zeile „Modem“) und in der Web-App angezeigt. Updates erfolgen über das Netzwerk aus der Web-App oder mit dem Programm CAN Tool; Geräte dürfen nur mit Versionen aktualisiert werden, die für ihren Typ gebaut sind.</p>`}
  ]
}
};

const LANG_NAMES = { ru:"Русский", en:"English", de:"Deutsch" };

function render(lang){
  const d = DOC[lang];
  document.getElementById("html-root").lang = lang;
  document.getElementById("doc-title").textContent = d.docTitle;
  document.getElementById("crumb").innerHTML = '<a href="/">MultiHot</a> / <a href="/manuals.html">' + d.crumb + '</a>';
  document.getElementById("cv-eyebrow").textContent = d.eyebrow;
  document.getElementById("cv-h1").textContent = d.h1;
  document.getElementById("cv-lede").textContent = d.lede;
  document.getElementById("toc-label").textContent = d.tocLabel;
  document.getElementById("doc-footer").innerHTML = d.footer;
  document.getElementById("toc-main").innerHTML = d.sections.map((s,i)=>
    `<li><a href="#${s.id}" data-n="${String(i+1).padStart(2,"0")}">${s.title}</a></li>`).join("");
  document.getElementById("main").innerHTML = d.sections.map((s,i)=>
    `<section class="screen" id="${s.id}"><h2><span class="num">${String(i+1).padStart(2,"0")}</span>${s.title}</h2>${s.html()}</section>`).join("");
  document.getElementById("lang-select").value = lang;
  try { localStorage.setItem("timberline_manual_lang", lang); } catch(e){}
}

const sel = document.getElementById("lang-select");
sel.innerHTML = Object.keys(LANG_NAMES).map(c=>`<option value="${c}">${LANG_NAMES[c]}</option>`).join("");
sel.addEventListener("change", ()=>render(sel.value));
let lang = /^ru\b/i.test(navigator.language || "") ? "ru" : (/^de\b/i.test(navigator.language || "") ? "de" : "en");
