const ORDER = ["home","clock","temp","calib","sys","daynight","backlight","info","versions","heater","modem","errors","ble","sleep","contacts"];
const STR = COPY;
const LANG_NAMES = { ru:"Русский", en:"English", de:"Deutsch" };
const ACCESS = { ru:"Как открыть:", en:"How to open:", de:"So öffnen Sie:" };

function hotspotHTML(list, texts){
  let n = 0; const seen = new Map();
  return list.map(([x1,y1,x2,y2,key])=>{
    const label = (texts[key]||[key])[0];
    if(!seen.has(key)){ n++; seen.set(key, n); }
    const num = seen.get(key);
    const l=(x1/PW*100).toFixed(2), t=(y1/PH*100).toFixed(2);
    const w=((x2-x1)/PW*100).toFixed(2), h=((y2-y1)/PH*100).toFixed(2);
    return `<div class="hot" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%"><span class="num">${num}</span></div>`;
  }).join("");
}
function legendHTML(list, texts){
  let n = 0; const seen = new Set();
  return list.map(([, , , ,key])=>{
    if(seen.has(key)) return "";
    seen.add(key); n++;
    const [label, desc] = texts[key] || [key, ""];
    return `<li><span class="n">${n}</span><span class="txt"><b>${label}</b>${desc?" — "+desc:""}</span></li>`;
  }).join("");
}
function render(lang){
  const t = STR[lang];
  document.documentElement.lang = lang;
  document.getElementById("doc-title").textContent = t.docTitle;
  document.getElementById("crumb").innerHTML = '<a href="/">MultiHot</a> / <a href="/manuals.html">' + t.crumb + '</a>';
  document.getElementById("cv-eyebrow").textContent = t.eyebrow;
  document.getElementById("cv-h1").textContent = t.h1;
  document.getElementById("cv-lede").textContent = t.lede;
  document.getElementById("np-control-k").textContent = t.npControl;
  document.getElementById("np-control-v").textContent = t.npControlV;
  document.getElementById("np-link-k").textContent = t.npLink;
  document.getElementById("np-link-v").textContent = t.npLinkV;
  document.getElementById("np-doc-k").textContent = t.npDoc;
  document.getElementById("toc-label").textContent = t.tocLabel;
  document.getElementById("doc-footer").innerHTML = t.footer;
  document.getElementById("doc-date").textContent = new Date().toLocaleDateString(t.dateLocale,{year:"numeric",month:"long",day:"numeric"});
  document.getElementById("main").innerHTML = ORDER.map(id=>{
    const g = GEOM[id], s = t.screens[id];
    return `<section class="screen" id="${id}">
      <div class="screen-head"><span class="tag">${s.tag}</span><h2>${s.title}</h2>
      <p class="access"><b>${ACCESS[lang]}</b> ${s.access}</p><p class="lede">${s.lede}</p></div>
      <div class="spec stack"><figure class="frame wide"><div class="screen-inner">
        <img src="${IMG}${g.img}" alt="${s.title}">${hotspotHTML(g.hot, s.t)}
      </div></figure><ul class="legend">${legendHTML(g.hot, s.t)}</ul></div>
      ${s.extra||""}</section>`;
  }).join("");
  document.getElementById("toc-main").innerHTML = ORDER.map(id=>`<li><a href="#${id}">${t.screens[id].title}</a></li>`).join("");
  document.getElementById("lang-select").value = lang;
  try { localStorage.setItem("timberline_manual_lang", lang); } catch(e){}
}
const sel = document.getElementById("lang-select");
sel.innerHTML = Object.keys(LANG_NAMES).map(c=>`<option value="${c}">${LANG_NAMES[c]}</option>`).join("");
sel.addEventListener("change", ()=>render(sel.value));
let lang = /^ru\b/i.test(navigator.language||"") ? "ru" : (/^de\b/i.test(navigator.language||"") ? "de" : "en");
try { const s = localStorage.getItem("timberline_manual_lang"); if (LANG_NAMES[s]) lang = s; } catch(e){}
render(lang);
</script>
